services:
  ollama:
    image: ollama/ollama:0.33.0
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  model-loader:
    image: ollama/ollama:0.33.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama pull "$${LLM_MODEL}" &&
        ollama pull "$${EMBEDDING_MODEL}"
    restart: "no"

  ingest:
    build:
      context: .
    depends_on:
      model-loader:
        condition: service_completed_successfully
    command: ["python", "-m", "app.ingest"]
    environment: &api-environment
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      DOCUMENTS_DIR: /app/data/documents
      INDEX_DIR: /app/data/index
      CHUNK_SIZE_WORDS: ${CHUNK_SIZE_WORDS:-220}
      CHUNK_OVERLAP_WORDS: ${CHUNK_OVERLAP_WORDS:-40}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-4}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.25}
      MODEL_CONTEXT_TOKENS: ${MODEL_CONTEXT_TOKENS:-4096}
      MODEL_OUTPUT_TOKENS: ${MODEL_OUTPUT_TOKENS:-500}
    volumes:
      - rag_index:/app/data/index
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    build:
      context: .
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment: *api-environment
    ports:
      - "8000:8000"
    volumes:
      - rag_index:/app/data/index:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  ollama_models:
  rag_index:
