name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Scan Python code
        run: bandit --quiet --recursive app

      - name: Audit production dependencies
        run: pip-audit --requirement requirements.txt

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build API image
        run: docker build --pull --tag owasp-llm-rag-api:ci .
        
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0

      - name: Generate Trivy reports
        run: |
          trivy --version
          trivy image \
            --image-src docker \
            --scanners vuln \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output trivy-report.json \
            --exit-code 0 \
            --timeout 10m \
            owasp-llm-rag-api:ci
          trivy convert \
            --format table \
            --output trivy-report.txt \
            trivy-report.json

      - name: Upload Trivy reports
        if: ${{ always() && hashFiles('trivy-report.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-api-image-report
          path: |
            trivy-report.json
            trivy-report.txt
          retention-days: 30
          if-no-files-found: error

      - name: Enforce Trivy policy with temporary exceptions
        run: |
          python3 -m unittest discover -s tests -p "test_trivy_policy.py" -v
          python3 scripts/check_trivy.py trivy-report.json